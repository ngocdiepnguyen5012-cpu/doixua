const pc=s.as.filter(x=>x.k=="ruong"||x.k=="hieu"||x.k=="thuyen");if(pc.length>=5){const t=Math.round(pc.reduce((a,x)=>a+x.i,0)*ri(10,15)/100);s.money-=t;L("🏛️ Cơ ngơi lớn phải nộp thuế cho quan phủ: "+t+" lạng.","r")}
if(p(.05+Math.max(0,-(s.duc||0))/500)){const x=R(s.as),kar=(s.duc||0)<=-20;
const T={ruong:"Hạn hán lũ lụt làm mất trắng mùa màng trên ruộng",nha:"Hỏa hoạn thiêu rụi một phần ngôi nhà",hieu:"Kẻ trộm đột nhập vét sạch cửa hiệu",thuyen:"Bão lớn đánh đắm thuyền hàng",vang:"Kẻ trộm khoét vách lấy mất vàng bạc",trau:"Dịch bệnh làm trâu cày chết hết"}[x.k];
if((s.duc||0)>=40&&p(.5))L("🍀 Tai ương đến nhưng nhờ phúc đức dày, "+x.n+" của bạn thoát nạn.","r");
else if(x.k=="ruong"||x.k=="nha"){const m=Math.round(x.v*.25);s.money-=m;ch("hp",-3);L("🔥 "+T+", bạn phải chi "+m+" lạng sửa sang."+(kar?" Người ta bảo đó là nghiệp báo.":""),"r")}
else{s.as=s.as.filter(y=>y!=x);L("🔥 "+T+". Bạn mất "+x.n+" (trị giá "+x.v+" lạng)."+(kar?" Của phi nghĩa, nghiệp báo tìm đến.":""),"r")}}}
function assetPanel(){let h=`<div class="tb">Tiền mặt ${Math.round(s.money)} lạng · Tài sản ${asv()} lạng · Tổng ${Math.round(s.money+asv())} lạng · Chi phí sinh hoạt ${livingCost()} lạng/năm</div>`;
h+=s.as.length?s.as.map((x,i)=>`<div class="nc"><div style="font-size:30px">${x.e}</div><div class="nb"><b>${x.n}</b><small> · trị giá ${x.v} lạng${x.i?" · thu "+x.i+"/năm":x.k=="nha"?" · giúp khỏe, yên ổn":""}</small><div class="bt"><button onclick="sellA(${i})">Bán (${Math.round(x.v*.8)} lạng)</button></div></div></div>`).join(""):"<p>Bạn chưa có tài sản nào.</p>";
return h+`<div class="tb">Mua thêm</div>`+Object.keys(AT).map(k=>{const t=AT[k],d=s.money>=t.p?"":"disabled";return `<div class="nc"><div style="font-size:30px">${t.e}</div><div class="nb"><b>${t.n}</b><small> · ${t.p} lạng${t.i?" · thu "+t.i+"/năm":""}</small><div class="bt"><button ${d} onclick="buyA('${k}')">Mua</button></div></div></div>`}).join("")}
function kid(i,k){if(ev||s.dead||!s.ia)return;const c=s.cl[i];if(!c)return;s.ia=0;let r;
if(k==0){c.v=Math.min(100,(c.v??50)+8);r="Bạn dành thời gian vui đùa với "+c.n+", bé rất vui."}
else if(k==1){c.hoc=cl(c.hoc+4);c.v=Math.max(0,(c.v??50)-2);r="Bạn kèm "+c.n+" học chữ chăm chỉ, kiến thức tăng thêm."}
else if(k==2){s.money-=20;c.v=Math.min(100,(c.v??50)+6);r="Bạn thưởng quà cho "+c.n+"."}
else{c.v=Math.max(0,(c.v??50)-3);if(c.t=="ham chơi"&&p(.2)){c.t="chăm học";r="Nhờ nghiêm khắc răn dạy, "+c.n+" đã chịu chăm chỉ hơn."}else r="Bạn nghiêm khắc răn dạy "+c.n+", bé hơi sợ."}
L("👨‍👧 "+r,"r");done()}
function kidPanel(){if(!s.cl.length)return "";const d=s.ia?"":"disabled";return `<div class="tb">Con cái</div>`+s.cl.map((c,i)=>`<div class="nc">${av({k:kk(c.a,!c.g),f:!c.g,n:c.n},52)}<div class="nb"><b>${c.n}</b><small> · ${c.a} tuổi · tính ${c.t}</small><div class="bar"><i style="width:${c.v??50}%"></i></div><small>Tình thân ${c.v??50}</small><div class="bt" style="flex-wrap:wrap"><button ${d} onclick="kid(${i},0)">Vui đùa</button><button ${d} onclick="kid(${i},1)">Kèm học</button><button ${d} onclick="kid(${i},2)">Thưởng (-20)</button><button ${d} onclick="kid(${i},3)">Răn dạy</button></div></div></div>`).join("")}
const NM=[["Khôi","Bảo","Tài","Phúc","Nghĩa","Hưng"],["Hạnh","Như","Ngọc","Thảo","Mai","Phượng"]],TR={Khôi:"chăm học",Bảo:"hiếu thảo",Tài:"tháo vát",Phúc:"hiếu thảo",Nghĩa:"hiếu thảo",Hưng:"tháo vát",Hạnh:"hiếu thảo",Như:"chăm học",Ngọc:"chăm học",Thảo:"hiếu thảo",Mai:"tháo vát",Phượng:"tháo vát"};
function tryChild(b){const sp=nf("phoi");if(!sp)return "Bạn chưa có gia thất.";
if(s.preg)return sp.n+" đã có tin vui rồi, cả nhà đang chờ ngày sinh. 🤰";
if(s.kids>=5)return "Nhà đã đông con, hai vợ chồng thấy thế là đủ.";
if(s.age-(s.f?0:2)>42)return "Tuổi tác không còn thuận cho chuyện sinh nở.";
if(sp.v<10){bond(sp,-3);return sp.n+" chưa muốn có con vào lúc này, cần thêm thời gian."}
if(p(.5+sp.v/250+(b||0)+((s.dm||50)-50)/500)){s.preg=1;bond(sp,4);return "Hai vợ chồng bàn bạc rồi có tin vui: "+(s.f?"bạn":sp.n)+" có thai! 🤰"}
bond(sp,1);return "Hai vợ chồng cố gắng nhưng năm nay chưa có tin vui."}
function nameE(c){const nm=sh(NM[c.g?0:1]).slice(0,3);return{t:"Hai vợ chồng bàn nhau đặt tên cho bé "+(c.g?"trai":"gái")+". Bạn chọn tên nào?",o:nm.map(x=>o(x+" (mong con "+TR[x]+")",()=>{c.n=x;if(p(.6))c.t=TR[x];return "Bé được đặt tên là "+x+", cả nhà gửi gắm bao hy vọng."}))}}
function born2(pre){const c=born();if(pre)L(pre,"r");L("👶 Bé "+(c.g?"trai":"gái")+" chào đời, khỏe mạnh.","r");show(nameE(c));return ""}
function birthE(){const sp=nf("phoi");return{t:"Đến ngày sinh nở, cả nhà hồi hộp chờ tin. 👶",o:[
o("Mời thầy lang và bà mụ giỏi nhất (-60 lạng)",()=>{s.money-=60;return born2()}),
o("Nhờ bà mụ trong làng (-10 lạng)",()=>{s.money-=10;if(p(.08)){ch("hp",-6);if(sp)bond(sp,-8);return born2("Ca sinh khó, mẹ con suýt nguy kịch nhưng may qua khỏi.")}return born2()}),
o("Tự lo ở nhà cho đỡ tốn",()=>{if(p(.04)){if(s.f)return die("mất vì khó sinh");s.wife=null;s.npc=s.npc.filter(x=>x!=sp);ch("hp",-8);L("💔 "+(sp?sp.n:"Vợ bạn")+" mất vì khó sinh, đứa trẻ may mắn sống sót.","r");return born2()}return born2()})]}}
function homeYear(){const sp=nf("phoi");if(sp&&p(.4))bond(sp,-1)}
function kidsYear(){let g=0;s.cl.forEach(c=>{c.a++;
if(c.a==6)L("📚 "+c.n+" đến tuổi học chữ.");
if(c.a==18){c.j=c.t=="chăm học"?"học trò":c.t=="tháo vát"?"buôn bán":"làm ruộng";L("🧑 "+c.n+" đã trưởng thành, tính "+c.t+", nay theo nghề "+c.j+".")}
if(c.a>=18&&!c.out){const b={"học trò":0,"cử nhân":ri(30,80),"buôn bán":ri(-10,60),"làm ruộng":ri(5,20)}[c.j]||0;g+=Math.round(b*(c.t=="hiếu thảo"?1.5:c.t=="ham chơi"?.2:1)*(.6+(c.v??50)/125));if(c.t=="hiếu thảo"&&s.age>50)ch("hp",1)}});
if(g){s.money+=g;L(g>0?"👨‍👧 Các con đỡ đần gia đình thêm "+g+" lạng.":"Các con làm ăn thua lỗ, bạn phải bù "+(-g)+" lạng.","r")}}
function dsE(){if(ev||s.dead)return;show({t:"☯️ Tu dưỡng: chọn phép dưỡng sinh cho những năm tới, hoặc làm việc thiện tích đức.",o:[...Object.keys(DS).map(k=>o(DS[k].n+" ("+DS[k].d+")",()=>{s.ds=k;return "Bạn theo phép dưỡng sinh: "+DS[k].n+"."})),...(s.di?[o("🙏 Bố thí người nghèo (-60 lạng)",()=>{s.di=0;s.money-=60;dk(6);ch("uy",2);return "Bạn bố thí cho người khốn khó, lòng nhẹ nhõm. ☯️"}),o("🙏 Cúng dường, phóng sinh (-30 lạng)",()=>{s.di=0;s.money-=30;dk(4);return "Bạn cúng dường chùa chiền và phóng sinh chim cá. ☯️"}),o("🙏 Tụng kinh, tu tâm",()=>{s.di=0;ch("hp",1);dk(3);return "Bạn ngồi tụng kinh, tâm an tĩnh. ☯️"})]:[]),o("Thôi, không dưỡng sinh nữa",()=>{s.ds=null;return "Bạn không theo phép dưỡng sinh nào."})]})}
function up(){if(ev||s.dead)return;
s.age++;const a=s.age;s.ia=1;s.gi=1;s.ci=1;s.di=1;tab="life";s.log.push({h:a});
if(a>=6&&a<=40&&s.deg<3)ch("hoc",Math.max(0,ri(0,3)+(s.hue>=70?1:s.hue<30?-1:0)));
if(a>35&&p(.5))ch("dm",-1);
if(an()<30)ch("hp",-1);else if(an()>=75)ch("hp",1);
if(a>40)ch("hp",-ri(0,2)-(a>60?ri(1,2):0));
if(svc()){s.yr++;if(s.path!="thuong")ch("sung",ri(-2,1));if(s.path=="hiep"&&p(.3))s.wt=Math.max(0,s.wt-1)}
if(s.ds&&a>=12){const D=DS[s.ds];ch("hp",s.ds=="khi"&&a>60?ri(0,1):ri(D.a,D.b)+(s.path=="y"?1:0));s.money-=D.c;if(D.l)ch("liem",D.l)}
const k=livingCost();
if(s.ret)s.money+=Math.round(SAL[s.rank]*({thuong:.4,y:.25,nho:.2,hiep:.15,nong:.35,cong:.25}[s.path]||.3))-k;else if(s.rank)s.money+=Math.round(SAL[s.rank]*({thuong:ri(7,22),y:ri(8,16),nho:ri(4,10),hiep:ri(2,25),nong:ri(6,15),cong:ri(8,15)}[s.path]||10)/10)-k;else s.money+=FA[s.fam].inc;
kidsYear();clanYear();karmaYear();homeYear();assetYear();if(s.money<0)ch("uy",-2);
const d=(a<45?.004:Math.pow((a-45)/45,3)*.9+.004)*(s.ds?.85:1)*(s.path=="y"?.8:1)*(1-(s.duc||0)/300);
if(s.hp<=0||p(d*(1+Math.max(0,50-s.hp)/60)))return die();
if(a==6){L("📚 Bạn bắt đầu học chữ Nho với thầy đồ.");addN("thay","thầy đồ","nho",0,30)}
if(a==10)addN("ban","bạn thân","dan",R([0,1]),25);
if(a==18)giveA();
if(a==19){addN("dich","đối thủ",s.path,R([0,0,1]),-15);addN("quy",PR[s.path]||"quý nhân",s.path,R([0,0,1]),25)}
if(s.wait>0&&--s.wait==0&&s.deg>=2){s.rank=s.deg==3?2:1;s.yr=0;L("📜 Triều đình khởi phục chức quan cho bạn: "+RK[s.rank]+".")}
let e=null;
if(s.preg&&a!=18){s.preg=0;e=birthE()}
else if(a==18&&!s.path)e=pathE();
else if(a>=16&&a%3==0&&s.path=="quan"&&!s.ret&&s.hoc>=30&&(s.deg<2||(s.deg==2&&s.rank<=1)))e=examE();
else if(svc()&&s.rank<7&&s.yr>=3&&p(.3))e=promoE();
else{e=pick();if(!e)L(R(Q))}
if(e)show(e);else done()}
function show(e){cn=null;const t=typeof e.t=="function"?e.t():e.t;const ic=cn?av(cn):"";s.lq=t.replace(/[^\p{L}\p{N}\s,.?!“”-]/gu,"").trim();s.lqa=s.age;
if(e.o){L(t,"q",ic);ev=e;render()}else{L(t,"",ic);const r=e.f&&e.f();if(r)L(r,"r");done()}}
function pk(i){const e=ev;ev=null;const r=e.o[i].f();if(r)L(r,"r");if(ev)return render();done()}
function done(){if(s.dead)return;if(s.hp<=0)return die();save();render()}
function die(c){s.dead=1;kd0=s.duc||0;try{localStorage.setItem("kd0",kd0)}catch(e){}try{localStorage.removeItem("quan")}catch(e){}
const why=c||(s.hp<=0?"sức khỏe suy kiệt":s.age>65?"tuổi già":R(["bạo bệnh","cảm nặng","bệnh phổi"]));
s.ep=s.path=="nong"&&s.rank>=5?"Ruộng đất của bạn trải dài đến tận chân trời, con cháu đời đời no đủ.":s.path=="cong"&&s.rank>=5?"Tay nghề của bạn để lại những tác phẩm truyền đời.":s.path=="y"&&s.rank>=5?"Tên bạn được truyền tụng như một bậc lương y từ mẫu.":s.path=="nho"&&s.rank>=5?"Học trò khắp nơi nhớ ơn, bạn được tôn là bậc thầy của muôn đời.":s.path=="hiep"&&s.rank>=5?"Giang hồ truyền tụng tên bạn mãi về sau.":s.path=="vo"&&s.rank>=5?"Bạn được ghi danh bậc công thần, tên khắc bia đá nghìn năm.":s.path=="thuong"&&s.rank>=5?"Thương hiệu của bạn lừng danh khắp nước, con cháu được hưởng phúc ấm.":s.path&&s.path!="quan"&&s.rank>=1?"Bạn sống trọn một đời "+({vo:"binh nghiệp",thuong:"buôn bán",y:"cứu người chữa bệnh",nho:"dạy học, làm thơ",hiep:"giang hồ",nong:"cày cấy",cong:"làm nghề thủ công"}[s.path])+", lắm thăng trầm.":s.rank>=6&&s.uy>=70?"Sử sách ghi danh một bậc danh thần, dân lập đền thờ.":s.rank>=3&&s.liem<25?"Sử sách chép bạn là kẻ gian thần tham lam.":s.rank>=1?"Bạn là một vị quan "+(s.liem>=60?"thanh liêm, được dân nhớ ơn.":"có công có tội, hậu thế còn tranh luận."):"Bạn sống đời bình dị, chưa từng bước chân vào chốn quan trường.";
if(c&&/tru di/.test(c))s.ep="Cả "+(s.cn?s.cn.n:"dòng họ")+" bị xóa sổ, tên bạn bị ghi vào bia nhục.";
s.sc=Math.round(s.rank*20+(s.uy+s.liem)/2+s.age+s.kids*3+s.duc/4+Math.max(0,s.money)/500);
L("💀 Bạn qua đời ở tuổi "+s.age+", "+(c?why:"vì "+why)+".","d");render()}
const title=()=>s.ret?RK[s.rank]+({quan:" (cáo lão)",vo:" (giải ngũ)",thuong:" (nghỉ ngơi)",y:" (gác nghề)",nho:" (ở ẩn)",hiep:" (gác kiếm)",nong:" (an hưởng)",cong:" (gác nghề)"}[s.path]||" (hưu)"):s.rank?RK[s.rank]:s.deg>1?"Chờ bổ nhiệm":s.deg==1?"Tú tài":s.age>5?"Học trò":"Trẻ thơ";
function render(){
$("start").hidden=!!s;$("game").hidden=!s;if(!s)return;
$("hd").innerHTML=`<div class="hr" onclick="tgl()">${av({k:s.age<12?"tre":(s.path||"dan"),f:s.f&&!s.disg,n:s.name},38)}<div><b>🏮 ${s.name}</b><br><small>Tuổi ${s.age} · ${title()} · 💰 ${Math.round(s.money).toLocaleString("vi-VN")} lạng${ex?(s.wife?" · 💍 "+s.wife:"")+(s.kids?" · 👶 "+s.kids:"")+(s.preg?" · 🤰":"")+(s.hv&&s.deg>=2?" · 🎓 "+s.hv:"")+(s.dh?" · 🎖️ "+s.dh:"")+(s.gk?" · 🧒 "+s.gk:"")+(s.path=="hiep"?" · 🔎 "+s.wt:""):""}</small></div><span class="chv">${ex?"▴":"▾"}</span></div>${ex?fam():""}`;
$("bars").className=ex?"":"cp";$("bars").innerHTML=!ex?ST.filter(x=>(x[3]||x[0]=="sung")&&(x[0]!="sung"||(s.rank>=1&&s.path!="thuong"&&s.path!="hiep"))).map(([k,i])=>`<span class="${s[k]<30?"lo":""}">${i} ${s[k]}</span>`).join("")+(s.path=="hiep"?`<span>🔎 ${s.wt}</span>`:""):ST.filter(x=>x[0]!="sung"||(s.rank>=1&&s.path!="thuong"&&s.path!="hiep")).map(([k,i,n])=>`<div>${i} ${n} · ${s[k]}<div class="bar"><i class="${s[k]<30?"lo":""}" style="width:${s[k]}%"></i></div></div>`).join("");
$("bars").innerHTML+=ex?`<div>🕊️ An yên · ${an()}<div class="bar"><i style="width:${an()}%"></i></div></div><div>☯️ Phúc đức · ${s.duc}<div class="bar"><i class="${s.duc<0?"lo":""}" style="width:${(s.duc+100)/2}%"></i></div></div>`:`<span class="${an()<30?"lo":""}">🕊️ ${an()}</span><span class="${s.duc<0?"lo":""}">☯️ ${s.duc}</span>`+(s.preg?"<span>🤰</span>":"");
const lg=$("log");if(ev||s.dead)tab="life";$("tabs").innerHTML=(ev||s.dead)?"":TB.filter(([k])=>k!="ds"||s.age>=12).map(([k,n,l])=>`<button class="${tab==k?"pb":""}" onclick="tb('${k}')"><div>${n}</div><small>${l}</small></button>`).join("");
if(tab=="soc")lg.innerHTML=socPanel();else if(tab=="gig")lg.innerHTML=gigPanel();else if(tab=="clan")lg.innerHTML=clanPanel();else if(tab=="asset")lg.innerHTML=assetPanel();else{lg.innerHTML=s.log.map(x=>x.h!=null?`<h3>Tuổi ${x.h} · ${cc(x.h)}</h3>`:x.ic?`<div class="np">${x.ic}<p class="${x.c||""}">${x.t}</p></div>`:`<p class="${x.c||""}">${x.t}</p>`).join("");lg.scrollTop=lg.scrollHeight}
const a=$("act");
if(s.dead)a.innerHTML=`<div class="sum"><b>⚰️ ${s.name}</b><br>Hưởng dương ${s.age} tuổi · Chức cao nhất: ${RK[s.rank]}<br>Của cải: ${Math.round(s.money).toLocaleString("vi-VN")} lạng · Con cái: ${s.kids}${s.hv&&s.deg>=2?"<br>🎓 Học vị: "+s.hv:""}${s.dh?"<br>🎖️ "+s.dh:""}<br>☯️ Phúc đức: ${s.duc}${s.duc>=40?" (phúc dày, kiếp sau được nhờ)":s.duc<=-40?" (nghiệp nặng, kiếp sau còn chịu quả báo)":""}<br><i>${s.ep}</i><br><b>Điểm cuộc đời: ${s.sc}</b></div><button class="pb" onclick="reset()">Đầu thai kiếp mới</button>`;
else if(ev)a.innerHTML=ev.o.map((x,i)=>`<button onclick="pk(${i})">${x.l}</button>`).join("");
else a.innerHTML=`<button class="pb up" onclick="spinUp()">${drum()}<span>Sang năm mới<br><small>${cc(s.age)} → ${cc(s.age+1)}</small></span></button>`}
try{if(localStorage.getItem("quan"))$("bc").hidden=false}catch(e){}
</script>
